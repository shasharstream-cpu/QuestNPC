# QuestNPC - налаштування

# Плейсхолдери PlaceholderAPI у діалогах NPC (%player_name% тощо).
# CMI віддає свої плейсхолдери (%cmi_...%) через PlaceholderAPI,
# тому окремої інтеграції з CMI не потрібно.
placeholders: true

# Репліка NPC над його головою (її бачить лише той, хто говорить з NPC)
bubble:
  enabled: true
  max-length: 140      # довші репліки обрізаються
  height-offset: 0.7   # висота над головою NPC, у блоках

# Меню вибору при кліку по NPC: Торгівля / Діалог / Квест.
# Показуються лише ті пункти, які в NPC є. Якщо нічого, крім діалогу,
# діалог відкривається одразу. false = завжди одразу діалог, як раніше.
menu:
  enabled: true

# Панель прогресу квесту зверху екрана (BossBar). Гравець може вимкнути її
# для себе в журналі (/quests). false = панель вимкнена для всіх.
tracker:
  enabled: true

# Пропозиція квесту: коли кнопка діалогу видає квест (дія quest:<id>),
# спершу показується вікно з описом і кнопками «Прийняти» / «Відхилити».
# false = квест береться одразу, як у старих версіях.
offer:
  confirm: true

quest:
  allow-cancel: true   # гравець може скасувати активний квест у журналі (/quests)
  max-active: 0        # максимум одночасно активних квестів у гравця (0 = без ліміту)

# Сповіщення про виконання квесту
notify:
  title: true          # великий напис на екрані
  broadcast: false     # true = повідомлення всім гравцям на сервері

# Знаки над NPC: жовте «!» - є новий квест, золоте «?» - є що здати,
# сіре «?» - активний квест веде до цього NPC. Кожен гравець бачить лише свої знаки.
markers:
  enabled: true
  range: 32.0            # на якій відстані від NPC показувати знак, у блоках
  height-offset: 0.9     # висота знака над головою NPC

# Щоденні квести оновлюються в заданий час за цим часовим поясом.
# Порожньо = часовий пояс сервера. Приклад: Europe/Kyiv
daily:
  timezone: ""

# Поза NPC «сидить»: на скільки блоків нижче за NPC ставиться невидиме сидіння.
# Якщо NPC висить у повітрі чи провалюється, підлаштуй число і виконай /mizkoprav reload.
pose:
  sit-offset: -0.5

# Розмови між NPC (/mizkoprav chatter)
chatter:
  chat-messages: false   # true = фрази розмови ще й дублюються в чат гравцям поруч

# Етапи-дії (добути блоки, зібрати урожай, мед, розведення, крафт, торгівля)
actions:
  count-creative: false   # false = дії в креативі не зараховуються
  placed-memory: 100000   # скільки поставлених гравцями блоків пам'ятати на світ (вони не рахуються як добуті)
