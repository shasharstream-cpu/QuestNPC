# QuestNPC - налаштування

# Плейсхолдери PlaceholderAPI у діалогах NPC (%player_name% тощо).
# CMI віддає свої плейсхолдери (%cmi_...%) через PlaceholderAPI,
# тому окремої інтеграції з CMI не потрібно.
placeholders: true

# Репліка NPC над його головою (її бачить лише той, хто говорить з NPC)
bubble:
  enabled: true
  max-length: 140      # довші репліки обрізаються
  height-offset: 0.7   # висота над головою NPC, у блоках

# Меню вибору при кліку по NPC: Торгівля / Діалог / Квест.
# Показуються лише ті пункти, які в NPC є. Якщо нічого, крім діалогу,
# діалог відкривається одразу. false = завжди одразу діалог, як раніше.
menu:
  enabled: true
