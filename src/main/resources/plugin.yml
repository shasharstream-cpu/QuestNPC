name: QuestNPC
version: 0.5.1
main: ua.questnpc.QuestNPC
api-version: "26.3"
softdepend: [PlaceholderAPI, CMI]
description: NPC with skins and native dialogs, edited in-game with the Mizkoprav wand.
commands:
  mizkoprav:
    description: Видати Мізкоправ, керувати NPC і квестами
    usage: /mizkoprav [give|list|remove|tp|here|quests|editor|version|reload]
    aliases: [npcwand]
    permission: questnpc.admin
  quests:
    description: Журнал квестів
    usage: /quests
permissions:
  questnpc.admin:
    description: Створення і налаштування NPC та квестів
    default: op
